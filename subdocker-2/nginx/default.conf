# subdocker-2: served by nginx-unprivileged (runs as uid 101, listens on 8080).
server {
    listen 8080;
    server_name _;

    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
